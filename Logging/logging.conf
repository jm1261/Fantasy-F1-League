[loggers]
keys = root, InitializeLineup, InitializeGeneralUtils, InitializeResults, InitializeManager, DataIO, LineupAnalysis, LineupProcessing, StatisticalAnalysis, Plotting, CheckManager, ManagerProcessing, ManagerAnalysis, InitializePrize, PrizeAnalysis, PrizeProcessing, SeasonLaunch, FormatUtilities

[handlers]
keys = consoleHandler, FileHandler

[formatters]
keys = defaultFormatter

[logger_root]
level = DEBUG
handlers = consoleHandler, FileHandler

[logger_InitializeLineup]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = InitializeLineup
propagate = 0

[logger_InitializeGeneralUtils]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = InitializeGeneralUtils
propagate = 0

[logger_InitializeResults]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = InitializeResults
propagate = 0

[logger_InitializeManager]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = InitializeManager
propagate = 0

[logger_DataIO]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = DataIO
propagate = 0

[logger_LineupAnalysis]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = LineupAnalysis
propagate = 0

[logger_LineupProcessing]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = LineupProcessing
propagate = 0

[logger_StatisticalAnalysis]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = StatisticalAnalysis
propagate = 0

[logger_Plotting]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = Plotting
propagate = 0

[logger_CheckManager]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = CheckManager
propagate = 0

[logger_ManagerProcessing]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = ManagerProcessing
propagate = 0

[logger_ManagerAnalysis]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = ManagerAnalysis
propagate = 0

[logger_InitializePrize]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = InitializePrize
propagate = 0

[logger_PrizeAnalysis]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = PrizeAnalysis
propagate = 0

[logger_PrizeProcessing]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = PrizeProcessing
propagate = 0

[logger_SeasonLaunch]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = SeasonLaunch
propagate = 0

[logger_FormatUtilities]
level = DEBUG
handlers = consoleHandler, FileHandler
qualname = FormatUtilities
propagate = 0

[handler_consoleHandler]
class = StreamHandler
level = DEBUG
formatter = defaultFormatter
args = (sys.stdout,)

[handler_FileHandler]
class = FileHandler
level = DEBUG
formatter = defaultFormatter
args = ('%(logdir)s/FantasyLogger_%(log_date)s.log', 'a')

[formatter_defaultFormatter]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt = %Y-%m-%d %H%M%S
